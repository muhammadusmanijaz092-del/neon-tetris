<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Neon Background Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="96" y1="416" x2="416" y2="416" />

    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Glowing Neon T-Piece in Magenta -->
  <g filter="url(#glow-pink)">
    <!-- Top stem block -->
    <rect x="220" y="140" width="72" height="72" rx="10" fill="#ec4899" stroke="#f472b6" stroke-width="3" />
    <rect x="226" y="146" width="60" height="60" rx="6" fill="#be185d" opacity="0.7" />
    <rect x="230" y="150" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />

    <!-- Left wing block -->
    <rect x="140" y="220" width="72" height="72" rx="10" fill="#ec4899" stroke="#f472b6" stroke-width="3" />
    <rect x="146" y="226" width="60" height="60" rx="6" fill="#be185d" opacity="0.7" />
    <rect x="150" y="230" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />

    <!-- Center base block -->
    <rect x="220" y="220" width="72" height="72" rx="10" fill="#ec4899" stroke="#f472b6" stroke-width="3" />
    <rect x="226" y="226" width="60" height="60" rx="6" fill="#be185d" opacity="0.7" />
    <rect x="230" y="230" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />

    <!-- Right wing block -->
    <rect x="300" y="220" width="72" height="72" rx="10" fill="#ec4899" stroke="#f472b6" stroke-width="3" />
    <rect x="306" y="226" width="60" height="60" rx="6" fill="#be185d" opacity="0.7" />
    <rect x="310" y="230" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Glowing Neon I-Piece / Base support in Cyan -->
  <g filter="url(#glow-cyan)">
    <rect x="140" y="300" width="72" height="72" rx="10" fill="#00f2fe" stroke="#38bdf8" stroke-width="3" />
    <rect x="146" y="306" width="60" height="60" rx="6" fill="#0369a1" opacity="0.7" />
    <rect x="150" y="310" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />

    <rect x="300" y="300" width="72" height="72" rx="10" fill="#00f2fe" stroke="#38bdf8" stroke-width="3" />
    <rect x="306" y="306" width="60" height="60" rx="6" fill="#0369a1" opacity="0.7" />
    <rect x="310" y="310" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Glowing Inner Frame Border -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.4" />
</svg>
